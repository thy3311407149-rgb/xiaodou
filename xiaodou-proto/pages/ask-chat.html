<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=393, height=852" />
  <title>问小豆 · 对话</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/common.css" />
  <style>
    .chat { flex: 1; overflow-y: auto; padding: 12px 20px 16px; }
    .msg { display: flex; gap: 8px; margin-bottom: 14px; max-width: 92%; }
    .msg.user { margin-left: auto; flex-direction: row-reverse; }
    .msg .avatar {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      background: var(--purple-soft); display: grid; place-items: center; overflow: hidden;
    }
    .msg .avatar img { width: 22px; height: 24px; object-fit: contain; }
    .bubble {
      background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
      padding: 11px 13px; font-size: 14px; line-height: 1.65; color: var(--ink);
    }
    .msg.user .bubble {
      background: var(--accent); color: #fff; border-color: var(--accent);
      border-bottom-right-radius: 6px;
    }
    .msg.ai .bubble { border-bottom-left-radius: 6px; }
    .cite {
      margin-top: 10px; padding: 10px 12px; border-radius: 12px;
      background: var(--purple-soft); border: 1px solid rgba(124,92,250,.18);
      text-decoration: none; display: block; color: inherit;
    }
    .cite .t { font-size: 12px; font-weight: 700; color: var(--ai); }
    .cite .d { font-size: 12px; color: var(--ink-2); margin-top: 4px; line-height: 1.5; }
    .composer {
      position: absolute; left: 0; right: 0; bottom: calc(var(--tab-h) + var(--safe-bottom));
      padding: 10px 16px; background: rgba(245,242,237,.94); backdrop-filter: blur(12px);
      border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; z-index: 30;
    }
    .input-pill {
      flex: 1; height: 44px; background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--pill); display: flex; align-items: center; gap: 6px; padding: 0 10px;
    }
    .input-pill input { flex: 1; border: 0; outline: none; background: transparent; font-size: 14px; font-family: inherit; }
    .send-btn {
      width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent);
      color: #fff; display: grid; place-items: center; text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status-bar">
      <span class="time-pill">9:41</span>
      <div class="right">
        <span class="signal"><i></i><i></i><i></i><i></i></span>
        <span>5G</span>
        <i class="fa-solid fa-battery-full"></i>
      </div>
    </div>

    <div style="padding:0 20px 8px;display:flex;align-items:center;justify-content:space-between">
      <a href="ask.html" style="color:var(--ink);font-size:14px;font-weight:600;text-decoration:none">
        <i class="fa-solid fa-chevron-left"></i>
      </a>
      <div style="font-size:15px;font-weight:700">问小豆</div>
      <span style="width:32px"></span>
    </div>

    <div class="chat" style="padding-bottom:90px">
      <div class="msg user">
        <div class="bubble">认知负荷和我的录音有什么关系？</div>
      </div>
      <div class="msg ai">
        <div class="avatar"><img src="../assets/xiaodou-fab.svg" alt="" /></div>
        <div>
          <div class="bubble">
            你第 3 讲录音里提到「知识外化」——把概念写进可检索笔记，本质上是用外部结构分担工作记忆压力，从而降低内在负荷。这和 Sweller 说的外部存储策略一致。
            <a class="cite" href="detail-voice.html">
              <div class="t"><i class="fa-solid fa-waveform-lines"></i> 组织行为学 · 第3讲</div>
              <div class="d">「建议把认知负荷和组块写进第二大脑…」</div>
            </a>
            <a class="cite" href="detail.html">
              <div class="t"><i class="fa-solid fa-file-pdf"></i> 认知负荷理论_Sweller.pdf · p.14</div>
              <div class="d">外部存储可降低内在负荷</div>
            </a>
          </div>
        </div>
      </div>
    </div>

    <div class="composer">
      <div class="input-pill">
        <i class="fa-solid fa-camera" style="color:var(--ink-2)"></i>
        <input type="text" placeholder="继续追问…" />
        <i class="fa-solid fa-microphone" style="color:var(--ink-2)"></i>
      </div>
      <button class="send-btn" type="button"><i class="fa-solid fa-paper-plane"></i></button>
    </div>

    <nav class="tabbar">
      <a class="tab" href="library.html"><span class="ico"><i class="fa-solid fa-book"></i></span><span>知识库</span></a>
      <a class="tab on" href="ask.html"><span class="ico"><i class="fa-solid fa-comments"></i></span><span>问小豆</span></a>
      <a class="tab" href="graph.html"><span class="ico"><i class="fa-solid fa-share-nodes"></i></span><span>小豆图谱</span></a>
    </nav>
    <div class="home-indicator"></div>
  </div>
</body>
</html>
