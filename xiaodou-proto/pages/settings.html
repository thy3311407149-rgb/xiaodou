<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=393, height=852" />
  <title>设置 · 第二大脑</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/common.css" />
  <style>
    .group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; margin-bottom: 14px; }
    .row {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px;
      border-bottom: 1px solid var(--line); text-decoration: none; color: inherit;
    }
    .row:last-child { border-bottom: 0; }
    .row .ico {
      width: 32px; height: 32px; border-radius: 9px; background: var(--surface-2);
      display: grid; place-items: center; color: var(--ink-2); font-size: 13px;
    }
    .row .label { flex: 1; font-size: 14px; font-weight: 600; }
    .row .val { font-size: 13px; color: var(--ink-2); }
    .toggle {
      width: 46px; height: 28px; border-radius: var(--pill); background: var(--accent);
      position: relative; flex-shrink: 0;
    }
    .toggle::after {
      content: ""; position: absolute; top: 3px; right: 3px;
      width: 22px; height: 22px; border-radius: 50%; background: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
    }
    .profile-card {
      display: flex; align-items: center; gap: 14px; padding: 16px;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md);
      margin-bottom: 18px;
    }
    .avatar {
      width: 56px; height: 56px; border-radius: 18px; object-fit: cover;
      border: 2px solid var(--line);
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status-bar">
      <span class="time-pill">9:41</span>
      <div class="right">
        <span class="signal"><i></i><i></i><i></i><i></i></span>
        <span>5G</span>
        <i class="fa-solid fa-battery-full"></i>
      </div>
    </div>

    <div class="main with-tab">
      <div class="back-row">
        <a href="library.html"><i class="fa-solid fa-chevron-left"></i> 返回</a>
        <span style="font-size:15px;font-weight:700;margin-left:4px">设置</span>
      </div>

      <div class="profile-card">
        <img class="avatar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200&h=200&fit=crop" alt="Tina" />
        <div style="flex:1">
          <div style="font-size:17px;font-weight:700">Tina</div>
          <div style="font-size:12px;color:var(--ink-2);margin-top:3px">tina@secondbrain.app</div>
        </div>
        <i class="fa-solid fa-chevron-right" style="color:var(--ink-3)"></i>
      </div>

      <div class="section-label" style="margin-top:0">采集与转写</div>
      <div class="group">
        <div class="row">
          <div class="ico"><i class="fa-solid fa-microphone"></i></div>
          <div class="label">实时转写</div>
          <div class="toggle"></div>
        </div>
        <div class="row">
          <div class="ico"><i class="fa-solid fa-language"></i></div>
          <div class="label">转写语言</div>
          <div class="val">中文</div>
        </div>
        <div class="row">
          <div class="ico"><i class="fa-solid fa-file-arrow-up"></i></div>
          <div class="label">文档自动拆解</div>
          <div class="toggle"></div>
        </div>
      </div>

      <div class="section-label">小豆与 AI</div>
      <div class="group">
        <div class="row">
          <div class="ico" style="color:var(--purple)"><i class="fa-solid fa-robot"></i></div>
          <div class="label">回答风格</div>
          <div class="val">简洁</div>
        </div>
        <div class="row">
          <div class="ico"><i class="fa-solid fa-quote-left"></i></div>
          <div class="label">优先引用库内资料</div>
          <div class="toggle"></div>
        </div>
      </div>

      <div class="section-label">隐私与账号</div>
      <div class="group">
        <div class="row">
          <div class="ico"><i class="fa-solid fa-lock"></i></div>
          <div class="label">生物识别解锁</div>
          <div class="toggle"></div>
        </div>
        <a class="row" href="login.html">
          <div class="ico"><i class="fa-solid fa-right-from-bracket"></i></div>
          <div class="label">退出登录</div>
          <i class="fa-solid fa-chevron-right" style="color:var(--ink-3);font-size:12px"></i>
        </a>
      </div>
    </div>

    <nav class="tabbar">
      <a class="tab" href="library.html"><span class="ico"><i class="fa-solid fa-book"></i></span><span>知识库</span></a>
      <a class="tab" href="ask.html"><span class="ico"><i class="fa-solid fa-comments"></i></span><span>问小豆</span></a>
      <a class="tab" href="graph.html"><span class="ico"><i class="fa-solid fa-share-nodes"></i></span><span>小豆图谱</span></a>
    </nav>
    <div class="home-indicator"></div>
  </div>
</body>
</html>
