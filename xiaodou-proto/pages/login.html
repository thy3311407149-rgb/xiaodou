<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=393, height=852" />
  <title>登录 · 第二大脑</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/common.css" />
  <style>
    .login-hero {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 28px 40px; text-align: center;
      background:
        radial-gradient(70% 50% at 50% 20%, rgba(124,92,250,.14), transparent 60%),
        var(--bg);
    }
    .login-hero img { width: 110px; height: 120px; margin-bottom: 18px; filter: drop-shadow(0 10px 20px rgba(124,92,250,.2)); }
    .login-hero h1 {
      font-family: var(--serif); font-size: 32px; font-weight: 600; letter-spacing: -.5px;
    }
    .login-hero p { margin-top: 10px; font-size: 14px; color: var(--ink-2); line-height: 1.6; max-width: 280px; }
    .field {
      width: 100%; height: 48px; border-radius: var(--pill); border: 1px solid var(--line);
      background: var(--surface); padding: 0 18px; font-size: 15px; font-family: inherit;
      outline: none; margin-bottom: 10px;
    }
    .social {
      display: flex; gap: 12px; justify-content: center; margin-top: 18px;
    }
    .social a {
      width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line);
      background: var(--surface); display: grid; place-items: center;
      color: var(--ink); font-size: 18px; text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status-bar">
      <span class="time-pill">9:41</span>
      <div class="right">
        <span class="signal"><i></i><i></i><i></i><i></i></span>
        <span>5G</span>
        <i class="fa-solid fa-battery-full"></i>
      </div>
    </div>

    <div class="login-hero">
      <img src="../assets/xiaodou-wave.svg" alt="小豆" />
      <h1>第二大脑</h1>
      <p>录音、笔记、文档同一处沉淀。<br>小豆帮你拆解、关联、随时问答。</p>

      <div style="width:100%;margin-top:28px;text-align:left">
        <input class="field" type="tel" placeholder="手机号" value="138 ···· 0821" />
        <input class="field" type="text" placeholder="验证码" />
        <a class="btn btn-primary btn-block" href="library.html" style="height:48px;font-size:15px;margin-top:6px">进入知识库</a>
      </div>

      <div style="margin-top:20px;font-size:12px;color:var(--ink-3)">或使用其他方式</div>
      <div class="social">
        <a href="library.html" aria-label="Apple"><i class="fa-brands fa-apple"></i></a>
        <a href="library.html" aria-label="微信"><i class="fa-brands fa-weixin" style="color:#07C160"></i></a>
        <a href="library.html" aria-label="邮件"><i class="fa-solid fa-envelope"></i></a>
      </div>

      <p style="margin-top:24px;font-size:11px;color:var(--ink-3)">登录即表示同意《用户协议》与《隐私政策》</p>
    </div>
    <div class="home-indicator"></div>
  </div>
</body>
</html>
