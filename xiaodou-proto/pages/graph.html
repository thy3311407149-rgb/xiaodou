<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="../css/common.css" />
  <style>
    .stat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 12px; }
    .stat {
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      padding: 12px 8px; text-align: center;
    }
    .stat b { display: block; font-size: 20px; font-weight: 700; letter-spacing: -.4px; }
    .stat span { font-size: 11px; color: var(--ink-2); font-weight: 500; }
    .graph-canvas-wrap {
      position: relative; height: 340px; border-radius: var(--radius-md);
      border: 1px solid var(--line); background:
        radial-gradient(circle at 50% 45%, rgba(124,92,250,.08), transparent 55%),
        var(--surface);
      overflow: hidden; margin-bottom: 8px;
    }
    .node {
      position: absolute; border-radius: var(--pill); padding: 7px 12px;
      font-size: 11px; font-weight: 700; color: #fff; white-space: nowrap;
      box-shadow: 0 4px 14px rgba(43,43,43,.12); text-decoration: none;
    }
    .graph-legend {
      position: absolute; left: 10px; bottom: 10px;
      background: rgba(255,255,255,.92); border: 1px solid var(--line);
      border-radius: 10px; padding: 8px 10px; font-size: 10px; color: var(--ink-2);
      display: flex; flex-direction: column; gap: 4px;
    }
    .graph-legend div { display: flex; align-items: center; gap: 6px; }
    .graph-legend i { width: 8px; height: 8px; border-radius: 50%; display: block; }
    .graph-hint {
      position: absolute; right: 10px; top: 10px; font-size: 10px; font-weight: 600;
      color: var(--ink-3); background: rgba(255,255,255,.85); padding: 4px 8px; border-radius: var(--pill);
    }
    .edge {
      position: absolute; height: 1.5px; background: rgba(58,53,48,.18);
      transform-origin: left center;
    }
  </style>
</head>
